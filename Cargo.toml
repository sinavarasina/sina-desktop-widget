[package]
name = "sina-desktop-widget"
version = "0.1.0"
edition = "2024"
description = "Native WayWi desktop widget suite (bar, notification center, launcher, OSD)"

[dependencies]
waywi = { version = "0.3", features = [
    "renderer-gpu",
    "renderer-software",
    "text",
    "image-png",
    "image-svg",
    "image-webp",
    "animation",
    "clipboard",
    "cursor-shape",
    "idle-inhibit",
    "screencopy",
    "tablet",
    "ime",
    "idle-notify",
    "control-ipc",
    "hyprland-ipc",
    "dbus",
    "pipewire",
    "audio-playback",
] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
