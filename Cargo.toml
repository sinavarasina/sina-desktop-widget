[package]
name = "sina-desktop-widget"
version = "0.1.0"
edition = "2024"
description = "Native WayWi desktop widget suite (bar, notification center, launcher, OSD)"

[dependencies]
waywi = { version = "0.1.10", features = [
    "renderer-gpu",
    "renderer-software",
    "text",
    "image-png",
    "image-svg",
    "image-webp",
    "animation",
    "ime",
    "control-ipc",
    "hyprland-ipc",
    "dbus",
    "pipewire",
    "audio-playback",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
